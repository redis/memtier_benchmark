name: Monitor-Input Fuzz

# Black-box fuzz driver for arbitrary_command::split_command_to_args() +
# monitor_command_list::load_from_file(). Mutates the in-tree seed corpus
# (tests/fuzz/monitor_input_corpus/) and runs memtier_benchmark
# --monitor-input=<mutated> --command="__monitor_line@__" against a local
# redis. Flags SIGSEGV, glibc "stack smashing detected", AddressSanitizer
# reports, and 30-second timeouts. (Fixes #408 partial -- CI wiring
# follow-up to the in-tree driver.)
#
# Trigger surface:
#   * nightly cron with FUZZ_ITER=2000 (high-iteration smoke for new
#     regressions; budget ~30 min)
#   * workflow_dispatch (manual; honours optional FUZZ_ITER input)
#   * PR with the `run-fuzz` label -- lets a PR author opt in when the
#     change plausibly affects the monitor-input parser, the arbitrary-
#     command splitter, or the RESP-encoded request path:
#         gh pr edit <num> --add-label run-fuzz
#     Smaller iteration count (300) so PR feedback is fast (~3-4 min).

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'FUZZ_ITER override (default 2000)'
        required: false
        default: '2000'
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [master, main, "2.4"]

permissions:
  contents: read

jobs:
  monitor-fuzz:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-fuzz')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y \
            build-essential autoconf automake pkg-config \
            libevent-dev libssl-dev zlib1g-dev redis-server

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build memtier_benchmark (ASAN+UBSan to catch silent corruptions)
        run: |
          autoreconf -ivf
          ./configure --enable-sanitizers --enable-ubsan
          make -j

      - name: Start local redis
        run: |
          redis-server --daemonize yes --port 6379 --save "" --logfile redis.log

      - name: Run fuzz driver
        env:
          MEMTIER: ${{ github.workspace }}/memtier_benchmark
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          # Smaller corpus pass on PR-label runs; larger on nightly/manual.
          # FUZZ_ITER is an upper bound on per-seed iterations; the run is
          # actually bounded by FUZZ_MAX_SECONDS below (a mutation that starts a
          # benchmark runs for --test-time seconds, so the full FUZZ_ITER sweep
          # would take hours and the job was always cancelled at its 35-minute
          # cap -- it never completed once before this budget was added).
          FUZZ_ITER: ${{ github.event_name == 'pull_request' && '300' || (inputs.iterations || '2000') }}
          # Hard-cap every mutated payload at 2 MiB. GROW_MAX alone is not
          # enough: mutate() applies up to 4 mutators, so several `grow`s
          # compound to ~8 MiB regardless. Processing a multi-MB --monitor-input
          # under the heavier instrumented ASAN+UBSan build runs ~22s/MiB on CI
          # runners (so ~8 MiB > 180s -- finite-but-slow, not a hang; <20s total
          # locally). 2 MiB keeps the worst case ~45s, well under the timeout.
          # Large-input coverage is retained by the 17 MiB / million-line
          # synthetic seeds. (#496)
          FUZZ_MAX_BYTES: "2097152"
          # Wall-clock budget for the whole sweep, sized to finish inside the
          # job's timeout-minutes with margin for the build/setup steps. The
          # driver iterates seeds round-robin, so a budget-bounded run still
          # covers every seed. ~3 min for PR-label feedback, ~25 min nightly.
          FUZZ_MAX_SECONDS: ${{ github.event_name == 'pull_request' && '180' || '1500' }}
          # Per-run timeout distinguishes a finite-but-slow large-payload run
          # from a true (infinite) hang. 90s was sized in #443; the now-heavier
          # instrumented build (--read-preference, per-thread CPU tracking,
          # Prometheus) pushed worst-case 8 MiB grow-mutation processing past it
          # on CI runners (the same inputs finish in <20s locally), so the
          # Monitor-Input Fuzz nightly was failing on slowness, not a hang.
          # Bump to 180s -- real hangs are infinite and still trip it. (#496)
          FUZZ_TIMEOUT: "180"
        run: python3 tests/fuzz/fuzz_monitor_input.py

      - name: Upload reproducers on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-fuzz-repros
          # The driver saves repros via tempfile prefix "mfuzz_" (-> /tmp/mfuzz_*.txt);
          # the old /tmp/fuzz_monitor_* glob never matched, so failures uploaded
          # nothing. Cover both to be safe. (#496)
          path: |
            /tmp/mfuzz_*
            /tmp/fuzz_monitor_*
          retention-days: 14
          if-no-files-found: ignore
